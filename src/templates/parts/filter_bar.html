<!-- ── FILTER BAR ── -->
<div class="filter-bar">
  <div class="container">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="technology">
        Technology
      </button>
      <button class="filter-btn" data-filter="science">Science</button>
      <button class="filter-btn" data-filter="culture">Culture</button>
      <button class="filter-btn" data-filter="opinion">Opinion</button>
      <button class="filter-btn" data-filter="design">Design</button>
    </div>
    <div class="sort-wrap">
      <span class="sort-label">Sort:</span>
      <select class="sort-select" id="sortSelect">
        <option value="latest">Latest</option>
        <option value="popular">Most read</option>
        <option value="long">Longest</option>
      </select>
    </div>
  </div>
</div>
