<header class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="#" class="logo">
      <span class="logo-mark">M</span>
      Meridian
    </a>
    <nav class="nav-links" id="navLinks">
    <style>

.search-form {
    display: flex;
    align-items: center;
    gap: 8px;
}


.search-input {
    width: 220px;
    padding: 8px 12px;

    border: 1px solid #e2e8f0;
    border-radius: 6px;

    font-size: 14px;
}


.search-input:focus {
    outline: none;
    border-color: #1a202c;
}


.search-button {

    padding: 8px 16px;

    background-color: #1a202c;
    color: white;

    border: none;
    border-radius: 6px;

    cursor: pointer;

    font-weight: 500;

}


.search-button:hover {

    opacity: 0.85;

}

</style>
      <a href="{% url 'home' %}" class="nav-link active">Home</a>
      <a href="{% url 'post_list_by_category' category_slug='technology' %}" class="nav-link">Technology</a>
      <a href="{% url 'post_list_by_category' category_slug='science' %}" class="nav-link">Science</a>
      <a href="{% url 'post_list_by_category' category_slug='culture' %}" class="nav-link">Culture</a>
      <a href="{% url 'post_list_by_category' category_slug='opinion' %}" class="nav-link">Opinion</a>
      <a href="{% url 'about' %}" class="nav-link">About</a>
      <form action="{% url 'post_search' %}" method="get" class="search-form">
        <input
        class="search-input"
        type="search"
        name="q"
        value="{{ request.GET.q }}"
        placeholder="Search articles..."
        >

        <button type="submit", class="search-button">
        Search
        </button>
      </form>
    </nav>
    <div class="nav-actions">
      <button class="btn-search" id="searchBtn" aria-label="Open search">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
      </button>
      <a href="#" class="btn-subscribe">Subscribe</a>
      <button class="nav-hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-box">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <input
        type="text"
        id="searchInput"
        placeholder="Search articles, topics, authors…"
        autocomplete="off"
      />
      <button id="searchClose" aria-label="Close search">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
    <p class="search-hint">Press <kbd>Esc</kbd> to close</p>
  </div>
</header>
